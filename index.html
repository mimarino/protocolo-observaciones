<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Observaciones</title>

<style>

body{
    font-family:'Segoe UI',sans-serif;
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    padding:20px;
}

.contenedor{
    width:500px;
    background:#f7f7f7;
    border:2px solid #b18ad8;
    border-radius:12px;
    padding:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.titulo{
    background:#7b43c4;
    color:white;
    font-weight:bold;
    text-align:center;
    padding:12px;
    border-radius:6px;
    margin-bottom:20px;
    font-size:18px;
}

.fila{
    display:flex;
    gap:8px;
    margin-bottom:12px;
}

.item{
    flex:1;
    padding:12px;
    border:1px solid #dcc8ed;
    border-radius:8px;
    background:white;
    cursor:pointer;
    transition:.2s;
    box-sizing:border-box;
}

.item:hover{
    background:#f5effc;
}

.item.seleccionado{
    background:#efe7fa;
    border:2px solid #7b43c4;
    font-weight:600;
}

button{
    width:100%;
    border:none;
    padding:12px;
    border-radius:6px;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.limpiar{
    background:#b69bdc;
}

.copiar{
    background:#7b43c4;
}

button:hover{
    opacity:.9;
}

</style>
</head>

<body>

<div class="contenedor">

    <div class="titulo">
        OBSERVACIONES
    </div>

    <div class="fila">
        <div class="item">Lee orden médica</div>
        <div class="item">Envía orden médica</div>
    </div>

    <div class="item">Diagnóstico ok</div><br>

    <div class="item">Pedí Autorización</div><br>

    <div class="item">
        Indico llevar documentación (orden, cred, DNI, etc)
    </div><br>

    <div class="item">
        Doy preparación y pido llevar estudios previos.
    </div><br>

    <div class="item">
        Pido asistir 15 minutos antes
    </div>

    <button class="limpiar" onclick="limpiar()">
        Limpiar
    </button>

    <button class="copiar" onclick="copiar()">
        Copiar
    </button>

</div>

<script>

document.querySelectorAll('.item').forEach(item=>{
    item.addEventListener('click',()=>{
        item.classList.toggle('seleccionado');
    });
});

function limpiar(){
    document.querySelectorAll('.item').forEach(item=>{
        item.classList.remove('seleccionado');
    });
}

function copiar(){

    let seleccionados = [...document.querySelectorAll('.seleccionado')]
        .map(x => x.innerText);

    if(seleccionados.length === 0){
        alert("No hay elementos seleccionados");
        return;
    }

    navigator.clipboard.writeText(
        seleccionados.join("\n")
    );

}

</script>

</body>
</html>
