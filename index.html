<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Observaciones</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI', sans-serif;
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    padding:20px;
}

.contenedor{
    width:500px;
    background:#f7f7f7;
    border:2px solid #b89edf;
    border-radius:12px;
    padding:16px;

    display:flex;
    flex-direction:column;
    gap:12px;

    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.titulo{
    background:#7a3db8;
    color:white;
    text-align:center;
    font-weight:bold;
    font-size:18px;
    padding:12px;
    border-radius:6px;
}

.fila{
    display:flex;
    gap:8px;
}

.item{
    flex:1;
    background:#fafafa;
    border:1px solid #dcc8ed;
    border-radius:8px;
    padding:10px 12px;
    cursor:pointer;
    transition:all .2s ease;
}

.item:hover{
    background:#f5effc;
}

.item.seleccionado{
    background:#efe7fa;
    border:2px solid #7a3db8;
    font-weight:600;
}

button{
    width:100%;
    border:none;
    padding:12px;
    border-radius:6px;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    opacity:.9;
}

.limpiar{
    background:#b89edf;
}

.copiar{
    background:#7a3db8;
}

</style>
</head>

<body>

<div class="contenedor">

    <div class="titulo">
        OBSERVACIONES
    </div>

    <div class="fila">
        <div class="item">Lee orden médica</div>
        <div class="item">Envia orden médica</div>
    </div>

    <div class="item">
        Pedí Autorización
    </div>

    <div class="item">
        Indico llevar documentación (orden, cred, DNI, etc)
    </div>

    <div class="item">
        Doy preparación y pido llevar estudios previos.
    </div>

    <div class="item">
        Pido asistir 15 minutos antes
    </div>

    <button class="limpiar" onclick="limpiar()">
        Limpiar
    </button>

    <button class="copiar" onclick="copiar()">
        Copiar
    </button>

</div>

<script>

document.querySelectorAll('.item').forEach(item => {

    item.addEventListener('click', () => {
        item.classList.toggle('seleccionado');
    });

});

function limpiar(){

    document.querySelectorAll('.item').forEach(item => {
        item.classList.remove('seleccionado');
    });

}

function copiar(){

    const seleccionados = [...document.querySelectorAll('.item.seleccionado')]
        .map(item => "• " + item.innerText);

    if(seleccionados.length === 0){
        alert("No hay elementos seleccionados");
        return;
    }

    navigator.clipboard.writeText(
        seleccionados.join("\n")
    );

}

</script>

</body>
</html>
